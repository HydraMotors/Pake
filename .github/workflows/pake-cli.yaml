```yaml
name: Build App With Pake CLI

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.26.2"

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        required: true
        default: "macos-latest"
        type: choice
        options:
          - "windows-latest"
          - "macos-latest"
          - "ubuntu-24.04"

      url:
        description: "Website URL"
        required: true
        type: string

      name:
        description: "App name (use lowercase for Linux)"
        required: true
        type: string

      icon:
        description: "Icon URL, leave empty to auto-fetch"
        required: false
        type: string

      width:
        description: "Window width (px)"
        required: false
        default: "1200"
        type: string

      height:
        description: "Window height (px)"
        required: false
        default: "780"
        type: string

      min_width:
        description: "Minimum window width (px)"
        required: false
        type: string

      min_height:
        description: "Minimum window height (px)"
        required: false
        type: string

      app_version:
        description: "App version"
        required: false
        default: "1.0.0"
        type: string

      fullscreen:
        description: "Start in fullscreen mode"
        required: false
        type: boolean
        default: false

      hide_title_bar:
        description: "Hide title bar (macOS only)"
        required: false
        type: boolean
        default: false

      new_window:
        description: "Allow sites to open new windows"
        required: false
        type: boolean
        default: false

      multi_arch:
        description: "Universal binary (macOS only)"
        required: false
        type: boolean
        default: false

      targets:
        description: "Linux package formats: deb,appimage,rpm,zst"
        required: false
        default: "deb"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.platform }}
    runs-on: ${{ inputs.platform }}
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Node.js Environment
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build CLI
        run: pnpm run cli:build

      - name: Setup mold linker
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1

      - name: Rust cache restore
        uses: actions/cache/restore@v4.2.0
        id: cache_store
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-pake-${{ hashFiles('**/Cargo.lock') }}

      - name: Build App (Linux/macOS)
        if: runner.os != 'Windows'
        timeout-minutes: 25
        shell: bash
        env:
          APP_URL: ${{ inputs.url }}
          APP_NAME: ${{ inputs.name }}
          APP_ICON: ${{ inputs.icon }}
          APP_WIDTH: ${{ inputs.width }}
          APP_HEIGHT: ${{ inputs.height }}
          APP_MIN_WIDTH: ${{ inputs.min_width }}
          APP_MIN_HEIGHT: ${{ inputs.min_height }}
          APP_VERSION: ${{ inputs.app_version }}
          APP_FULLSCREEN: ${{ inputs.fullscreen }}
          APP_HIDE_TITLE_BAR: ${{ inputs.hide_title_bar }}
          APP_NEW_WINDOW: ${{ inputs.new_window }}
          APP_MULTI_ARCH: ${{ inputs.multi_arch }}
          APP_TARGETS: ${{ inputs.targets }}
        run: |
          ARGS=("$APP_URL" "--name" "$APP_NAME")

          if [ -n "$APP_ICON" ]; then
            ARGS+=("--icon" "$APP_ICON")
          fi

          if [ -n "$APP_WIDTH" ]; then
            ARGS+=("--width" "$APP_WIDTH")
          fi

          if [ -n "$APP_HEIGHT" ]; then
            ARGS+=("--height" "$APP_HEIGHT")
          fi

          if [ -n "$APP_MIN_WIDTH" ]; then
            ARGS+=("--min-width" "$APP_MIN_WIDTH")
          fi

          if [ -n "$APP_MIN_HEIGHT" ]; then
            ARGS+=("--min-height" "$APP_MIN_HEIGHT")
          fi

          if [ -n "$APP_VERSION" ]; then
            ARGS+=("--app-version" "$APP_VERSION")
          fi

          if [ "$APP_FULLSCREEN" = "true" ]; then
            ARGS+=("--fullscreen")
          fi

          if [ "$APP_HIDE_TITLE_BAR" = "true" ]; then
            ARGS+=("--hide-title-bar")
          fi

          if [ "$APP_NEW_WINDOW" = "true" ]; then
            ARGS+=("--new-window")
          fi

          if [ "$APP_MULTI_ARCH" = "true" ]; then
            ARGS+=("--multi-arch")
          fi

          if [ -n "$APP_TARGETS" ] && [ "$RUNNER_OS" = "Linux" ]; then
            ARGS+=("--targets" "$APP_TARGETS")
          fi

          echo "Building app..."
          node dist/cli.js "${ARGS[@]}"

          if [ "$RUNNER_OS" = "Linux" ]; then
            echo "Generated files:"
            ls -lah
          fi

      - name: Build App (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 25
        shell: pwsh
        env:
          APP_URL: ${{ inputs.url }}
          APP_NAME: ${{ inputs.name }}
          APP_ICON: ${{ inputs.icon }}
          APP_WIDTH: ${{ inputs.width }}
          APP_HEIGHT: ${{ inputs.height }}
          APP_MIN_WIDTH: ${{ inputs.min_width }}
          APP_MIN_HEIGHT: ${{ inputs.min_height }}
          APP_VERSION: ${{ inputs.app_version }}
          APP_FULLSCREEN: ${{ inputs.fullscreen }}
          APP_HIDE_TITLE_BAR: ${{ inputs.hide_title_bar }}
          APP_NEW_WINDOW: ${{ inputs.new_window }}
        run: |
          $args = @($env:APP_URL, "--name", $env:APP_NAME)

          if ($env:APP_ICON) {
            $args += @("--icon", $env:APP_ICON)
          }

          if ($env:APP_WIDTH) {
            $args += @("--width", $env:APP_WIDTH)
          }

          if ($env:APP_HEIGHT) {
            $args += @("--height", $env:APP_HEIGHT)
          }

          if ($env:APP_MIN_WIDTH) {
            $args += @("--min-width", $env:APP_MIN_WIDTH)
          }

          if ($env:APP_MIN_HEIGHT) {
            $args += @("--min-height", $env:APP_MIN_HEIGHT)
          }

          if ($env:APP_VERSION) {
            $args += @("--app-version", $env:APP_VERSION)
          }

          if ($env:APP_FULLSCREEN -eq "true") {
            $args += "--fullscreen"
          }

          if ($env:APP_HIDE_TITLE_BAR -eq "true") {
            $args += "--hide-title-bar"
          }

          if ($env:APP_NEW_WINDOW -eq "true") {
            $args += "--new-window"
          }

          Write-Host "Building app..."
          node dist/cli.js @args

          git checkout -- src-tauri/Cargo.lock

      - name: Upload DMG (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-macOS
          path: ${{ inputs.name }}.dmg
          if-no-files-found: error
          retention-days: 3

      - name: Upload DEB (Linux)
        if: runner.os == 'Linux' && contains(inputs.targets, 'deb')
        uses: actions/upload-artifact@v6
        with:
          name: HYDRAMOTORS-Linux-deb
          path: hydramotors.deb
          if-no-files-found: error
          retention-days: 3

      - name: Upload AppImage (Linux)
        if: runner.os == 'Linux' && contains(inputs.targets, 'appimage')
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Linux-AppImage
          path: ${{ inputs.name }}.AppImage
          if-no-files-found: error
          retention-days: 3

      - name: Upload RPM (Linux)
        if: runner.os == 'Linux' && contains(inputs.targets, 'rpm')
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Linux-rpm
          path: ${{ inputs.name }}.rpm
          if-no-files-found: error
          retention-days: 3

      - name: Upload ZST (Linux)
        if: runner.os == 'Linux' && contains(inputs.targets, 'zst')
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Linux-zst
          path: ${{ inputs.name }}-*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 3

      - name: Upload MSI (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.name }}-Windows
          path: ${{ inputs.name }}.msi
          if-no-files-found: error
          retention-days: 3

      - name: Rust cache store
        uses: actions/cache/save@v4.2.0
        if: steps.cache_store.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-pake-${{ hashFiles('**/Cargo.lock') }}
```
